name: CI

# Red de seguridad: ningún build roto ni test en rojo debería llegar a producción.
# NO hace deploy (el despliegue a Easypanel/Cloudflare sigue siendo manual, aparte).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Bloqueantes: si algo de esto falla, el merge no debería pasar.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Typecheck ya está limpio (0 errores) → bloqueante.
      - name: Typecheck
        run: npx tsc --noEmit

      # Lint ya está limpio (0 errores; los ~41 avisos restantes no bloquean) → bloqueante.
      - name: Lint
        run: npm run lint
